data:
  system: shimizu_morioka
  n_train_traj: 50
  n_val_traj: 15
  n_test_traj: 15
  steps: 5000
  dysts_warmup_steps: 2000
  dysts_perturbation_scale: 0.2
  dysts_dt_scale: 8.0
  dysts_method: DOP853
  dysts_rtol: 1.0e-12
  dysts_atol: 1.0e-12
  dysts_parameters: {a: 0.85, b: 0.5}
  seed: 0
model:
  state_dim: 3
  latent_dim: 32
  grassmann: false
  encoder_hidden_dims: [64, 32]
  activation: silu
  dropout: 0.0
  operator_init_scale: 0.999
  operator_init_noise: 0.001
  rollout_mode: latent
  reencode_every: [10, 25, 50, 100]
loss:
  lusch_alpha1: 1.0
  lusch_linf_weight: 0.0
  lusch_l2_weight: 0.0
  prediction_steps: 50
  linearity_steps: 50
training:
  optimizer_steps: 20000
  batch_size: 1024
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  amp: false
  seed: 0
  compile: false
  num_workers: 0
  prefetch_factor: 2
  eval_every: 500
  save_every: 500
