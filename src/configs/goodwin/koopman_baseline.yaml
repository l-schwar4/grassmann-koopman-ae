# Global Koopman autoencoder baseline for the three-state Goodwin oscillator.
#
# python src/train.py --config src/configs/goodwin/koopman_baseline.yaml \
#   --model_file src/model/koopman_baseline.py --model_class KoopmanAutoencoder

data:
  system: goodwin
  n_train_traj: 180
  n_val_traj: 20
  n_test_traj: 20
  goodwin_cache_dir: ./data/goodwin/cache
  goodwin_parameters:
    dt: 0.06
    duration: 40.0
    transient: 0.0
    trajectory_count: 500
    seed: 6
    split_seed: 1
    test_seed: 7
  noise_std: 0.0

model:
  state_dim: 3
  latent_dim: 32
  grassmann: false
  encoder_hidden_dims: [64, 32]
  activation: silu
  dropout: 0.0
  operator_init_scale: 0.999
  operator_init_noise: 0.001
  rollout_mode: latent
  reencode_every: [10, 25, 50, 100]

loss:
  lusch_alpha1: 1.0
  lusch_linf_weight: 0.0
  lusch_l2_weight: 0.0
  prediction_steps: 50
  linearity_steps: 50

training:
  optimizer_steps: 20000
  batch_size: 1024
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  amp: false
  seed: 0
  compile: false
  num_workers: 0
  prefetch_factor: 2
  eval_every: 500
  save_every: 500
