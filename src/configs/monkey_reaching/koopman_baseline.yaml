# Global Koopman autoencoder for movement-aligned reaching data.
data:
  system: monkey_reaching
  seed: 0
  reaching_data_path: ./data/monkey_reaching/reaching_data.h5

  reaching_path_class: both  # unobstructed, obstructed, or both
  # Zero-based target-coordinate clusters to include (six clusters are fixed).
  reaching_selected_targets: [0, 1, 2, 3, 4, 5]

  # Trials are stratified by target and path class into train/test.
  reaching_max_units: 192
  reaching_train_fraction: 0.7

model:
  # train.py replaces state_dim with the selected neural-unit count.
  state_dim: 196
  # Shared power-of-two capacity: latent_dim is 25% of the final encoder width.
  latent_dim: 32
  grassmann: false
  encoder_hidden_dims: [128, 64]
  activation: silu
  dropout: 0.0
  operator_init_scale: 0.999
  operator_init_noise: 0.001
  rollout_mode: latent
  reencode_every: [10, 25, 50, 100]

loss:
  balance_reaching_groups: true  # Equal neural/cursor weight in state reconstruction and prediction.
  lusch_alpha1: 1.0
  lusch_linf_weight: 0.0
  lusch_l2_weight: 0.0
  prediction_steps: 30
  linearity_steps: 30

training:
  optimizer_steps: 20000
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  amp: false
  seed: 0
  compile: false
  num_workers: 0
  prefetch_factor: 2
  eval_every: 500
  save_every: 500
